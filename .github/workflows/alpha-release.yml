name: VietMath Alpha Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/alpha-release.yml"

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: vietmath-windows-installer
            path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundle: dmg
            artifact: vietmath-macos-installer
            path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production web assets
        run: pnpm build
      - name: Build ${{ matrix.bundle }} alpha installer
        run: pnpm --filter @vietmath/desktop tauri build --bundles ${{ matrix.bundle }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
