name: Phase 0 Desktop

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "apps/desktop-spike/**"
      - "packages/**"
      - ".github/workflows/phase0-desktop.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Emit generated lockfile
        run: |
          echo "__VIETMATH_LOCK_BEGIN__"
          cat pnpm-lock.yaml
          echo "__VIETMATH_LOCK_END__"
      - name: Run tests
        run: pnpm test
      - name: Build web assets
        run: pnpm build

  desktop-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build web assets
        run: pnpm build
      - name: Build Tauri debug binary
        run: pnpm tauri:build
      - name: Report Windows binary size
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Get-Item "apps/desktop-spike/src-tauri/target/debug/vietmath.exe"
          Write-Host "VIETMATH_BINARY_BYTES=$($binary.Length)"
      - name: Report macOS binary size
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bytes=$(stat -f%z "apps/desktop-spike/src-tauri/target/debug/vietmath")
          echo "VIETMATH_BINARY_BYTES=$bytes"
