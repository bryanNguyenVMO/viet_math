name: VietMath Desktop CI

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - ".github/workflows/phase0-desktop.yml"
      - ".github/workflows/alpha-release.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build production web assets
        run: pnpm build

  desktop-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production web assets
        run: pnpm build
      - name: Build Tauri debug binary
        run: pnpm tauri:build
      - name: Upload Windows desktop alpha
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vietmath-desktop-windows-alpha
          path: apps/desktop/src-tauri/target/debug/vietmath.exe
      - name: Upload macOS desktop alpha
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: vietmath-desktop-macos-alpha
          path: apps/desktop/src-tauri/target/debug/vietmath
